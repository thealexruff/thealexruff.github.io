<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>11EVENT — Licht, Musik und Bilder für euren Abend</title>
<meta name="description" content="Eventlicht, DJ, Fotografie und Video für Hochzeiten, Firmenevents und private Feiern. Wählt euren Anlass.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/basis.css?v=17">
<link rel="stylesheet" href="css/wahl.css?v=17">
</head>
<body data-welt="wahl">

<div class="wahlseite">
  <div class="glut" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="wahlseite__kopf">
    <span class="marke marke--gross">
      <svg class="marke__11" viewBox="0 0 455 790" aria-hidden="true"><path d="M0 43H200V790H90V163H0Z"/><path d="M245 0H455V790H335V118H245Z"/></svg>
      <span class="marke__wort">EVENT</span>
    </span>
  </div>

  <main class="wahlseite__mitte">
    <div class="wahlseite__titel">
      <span class="pille">Licht · DJ · Foto · Video</span>
      <h1>Was für ein Abend<br>soll es werden?</h1>
      <p>Wir bauen das Licht, bringen die Musik mit und halten fest, was passiert.
         Wie das aussieht, hängt vom Anlass ab — sucht euch euren aus.</p>
    </div>

    <div class="karussell" id="karussell" role="list"></div>
    <div class="wahlpunkte" id="wahlpunkte"></div>
  </main>

  <footer class="wahlseite__fuss">
    <a href="mailto:info@11event.de">info@11event.de</a> · © <span data-jahr></span> 11EVENT
  </footer>
</div>

<div class="frage" id="uebernahme" data-offen="false" role="dialog" aria-modal="true" aria-labelledby="uebernahmeTitel">
  <div class="frage__blatt">
    <h2 id="uebernahmeTitel">Auswahl mitnehmen?</h2>
    <p id="uebernahmeText"></p>
    <ul class="frage__liste" id="uebernahmeListe"></ul>
    <div class="frage__knoepfe">
      <button class="knopf knopf--leer" type="button" data-tun="neu">Neu anfangen</button>
      <button class="knopf knopf--voll" type="button" data-tun="uebernehmen" id="uebernahmeJa">Mitnehmen</button>
    </div>
    <button class="frage__ab" type="button" data-tun="ab">Doch nicht wechseln</button>
  </div>
</div>

<script src="js/katalog.js?v=17"></script>
<script src="js/bilder.js?v=17"></script>
<script src="js/korb.js?v=17"></script>
<script src="js/wahl.js?v=17"></script>
</body>
</html>
